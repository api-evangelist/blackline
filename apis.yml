aid: blackline
name: BlackLine
description: >-
  BlackLine is a cloud-based financial operations (FinOps) and accounting
  automation platform that helps finance and accounting teams automate the
  financial close, account reconciliation, journal entry, transaction matching,
  intercompany, consolidation integrity, and reporting processes. BlackLine
  exposes a suite of RESTful APIs on its developer portal so customers and
  partners can integrate the platform with ERP systems, banking platforms,
  payroll, and reporting tools — covering period management, user and team
  management, account reconciliation, journals, task management, transaction
  matching, and reporting. APIs authenticate with OAuth 2.0 client credentials.
  BlackLine (NASDAQ: BL) is a public company surfaced in the API Evangelist
  network as a portfolio company of ICONIQ Capital.
